# Perfis de instalação por família de distribuição.
#
# Formato de cada linha (campos separados por |):
#   id | pm | base_pkgs | gui_pkgs | dkms_pkg | headers_hint | llvm_pkgs | sudo_bin | notes
#
#   id ........... nome do perfil (para --distro=ID ou autodetect via /etc/os-release)
#   pm ........... pacman | apt | dnf | zypper | xbps | apk | emerge | install_cmd
#   base_pkgs .... pacotes sempre instalados (nitroctl CLI)
#   gui_pkgs ..... pacotes da GUI GTK4 (PyGObject + Gtk4 + Adwaita)
#   dkms_pkg ..... pacote do DKMS (vazio = sem DKMS nessa distro)
#   headers_hint . como descobrir os headers do kernel rodando (comando ou padrão)
#   llvm_pkgs .... toolchain Clang (só instalada quando o kernel rodando é Clang)
#   sudo_bin ..... como elevar privilégio (sudo | doas | su-c)
#   notes ........ livre, aparece no log com --verbose
#
# Linhas começando com # são ignoradas. Espaços ao redor dos campos são aparados.

arch      | pacman  | python git base-devel linux-headers | python-gobject gtk4 libadwaita | dkms            | auto:pacman         | clang llvm lld            | sudo    | Arch e derivadas (CachyOS, EndeavourOS, Manjaro). linux-headers resolve para o kernel padrão; flavours usam <flavour>-headers.
cachyos   | pacman  | python git base-devel linux-cachyos-headers | python-gobject gtk4 libadwaita | dkms               | auto:pacman         | clang llvm lld            | sudo    | Kernel Clang: o driver compila com LLVM=1 via DKMS. Inclui linux-cachyos-headers por padrão.
debian    | apt     | python3 git build-essential dkms linux-headers-amd64 | python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 | dkms   | auto:apt           | clang llvm lld            | sudo    | Debian/Ubuntu/Mint/Pop!_OS. linux-headers-amd64 acompanha o kernel padrão; para outros kernels use linux-headers-$(uname -r).
ubuntu    | apt     | python3 git build-essential dkms linux-headers-generic | python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 | dkms  | auto:apt           | clang llvm lld            | sudo    | Ubuntu e flavours: linux-headers-generic acompanha o kernel padrão (HWE incluído).
fedora    | dnf     | python3 git gcc make kernel-devel kernel-headers dkms | python3-gobject gtk4 libadwaita | dkms            | auto:dnf            | clang llvm lld            | sudo    | Fedora/RHEL/CentOS Stream/Alma/Rocky. kernel-devel acompanha o kernel rodando (instale e reinicie se atualizou sem reboot).
opensuse  | zypper  | python3 git gcc make kernel-devel kernel-default-devel dkms | python3-gobject gtk4 libadwaita | dkms   | auto:zypper        | clang llvm lld            | sudo    | openSUSE Leap/Tumbleweed. kernel-default-devel para o kernel padrão; -devel do flavour para os demais.
void      | xbps    | python3 git base-devel linux-headers dkms | python3-gobject gtk4 libadwaita | dkms            | auto:xbps           | clang llvm lld            | sudo    | Void Linux (musl e glibc): projeto testado originalmente aqui.
alpine    | apk     | python3 git build-base linux-headers dkms | python3 gobject-introspection gtk4.0 libadwaita | dkms | auto:apk   | clang llvm lld            | doas    | Alpine usa OpenRC + doas por padrão; o serviço systemd do driver não se aplica (veja README).
gentoo    | emerge  | dev-lang/python dev-vcs/git sys-kernel/linux-headers sys-kernel/dkms | dev-python/pygobject gui-libs/gtk gui-libs/libadwaita | sys-kernel/dkms | manual   | llvm-core/clang llvm-core/llvm llvm-core/lld | sudo | Gentoo: instale via portage; kernel e headers vêm do seu kernel (sys-kernel/*-sources).
generic   | install_cmd | python3 git | python3-gi gtk4 libadwaita | (none)   | manual              | clang llvm              | su-c    | Fallback: sem gerenciador conhecido. Instale os pacotes na mão e rode com --no-deps --no-driver se preciso.
